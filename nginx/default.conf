# ==============================================================================
# Nginx Configuration: Reverse Proxy, TLS Termination & Metrics Exporter Stub
# ==============================================================================

# 1. HTTP Server Block (Port 8080) - Chuyển hướng HTTPS hoặc phục vụ Health check
server {
    listen 8080;
    server_name localhost 127.0.0.1;

    location /health {
        proxy_pass http://app:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# 2. HTTPS Server Block (Port 8443) - Reverse Proxy chính có mã hóa TLS
server {
    listen 8443 ssl;
    server_name localhost 127.0.0.1;

    # Chứng chỉ TLS tự ký RSA 3072 bit
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Giao thức và Cipher an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (Hardening)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Điểm tiếp nhận chính chuyển tiếp về service app
    location / {
        proxy_pass http://app:3000;
        
        # Ẩn header từ upstream để tránh trùng lặp do Nginx đã thêm
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# 3. Internal Metrics Stub Status (Port 8082) - Dành riêng cho nginx-prometheus-exporter
server {
    listen 8082;
    server_name localhost 127.0.0.1;

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }
}

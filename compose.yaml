services:
  # ==============================================================================
  # 0. Init Container: Phân quyền thư mục logs trước khi app và nginx khởi động
  # ==============================================================================
  init-logs:
    image: busybox:1.37.0
    container_name: pm-init-logs
    command: >
      sh -c "mkdir -p /logs/app /logs/nginx &&
             chown -R 1000:1000 /logs/app &&
             chown -R 101:101 /logs/nginx &&
             chmod -R 755 /logs/app /logs/nginx"
    volumes:
      - app_logs:/logs/app
      - nginx_logs:/logs/nginx
    restart: "no"

  # ==============================================================================
  # 1. Database: PostgreSQL 16 Alpine (Database Internal & Network Isolation)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-pm_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER:-postgres_exporter}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./db/init/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-permissions.sql:/docker-entrypoint-initdb.d/03-permissions.sql:ro
      - ./db/init/04-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ==============================================================================
  # 2. Database Management Tool: pgAdmin 4 (Bind localhost 127.0.0.1)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pm.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8081}:80"
    volumes:
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - database
      - management
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ==============================================================================
  # 3. Application: Node.js Express (Non-root UID 1000, Read-only Rootfs, Hardened)
  # ==============================================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pm-app
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pm_db}
      APP_DB_USER: ${APP_DB_USER:-pm_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      LOG_DIR: /app/logs
    volumes:
      - app_logs:/app/logs:rw
    networks:
      - web
      - database
    depends_on:
      init-logs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================================
  # 4. Web Server / Reverse Proxy: Nginx (TLS, Security Headers & Metrics Stub)
  # ==============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx:rw
    networks:
      - web
    depends_on:
      init-logs:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  web:
    driver: bridge
    name: pm_web_network
  database:
    driver: bridge
    internal: true
    name: pm_database_network
  management:
    driver: bridge
    name: pm_management_network

volumes:
  postgres_data:
    name: pm_postgres_data
  pgadmin_data:
    name: pm_pgadmin_data
  app_logs:
    name: pm_app_logs
  nginx_logs:
    name: pm_nginx_logs
